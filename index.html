<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#007bff">
</head>
<body>
  <div class="container">
    <h1>Cronômetro</h1>
    <div id="display">00:00:00.00</div>
    <div class="buttons">
      <button id="startPauseBtn">Iniciar</button>
      <button id="resetBtn">Zerar</button>
      <button id="pipBtn" title="Abrir janela flutuante com controles">Flutuar 🗗</button>
    </div>
  </div>

  <script>
    let timer = null;
    let startTime = 0;
    let elapsedTime = 0;
    let running = false;
    let pipWindow = null;

    const display = document.getElementById('display');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pipBtn = document.getElementById('pipBtn');

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      const milliseconds = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}.${milliseconds}`;
    }

    function updateDisplay(formattedTime) {
      display.textContent = formattedTime;
      if (pipWindow) {
        const pipDisplay = pipWindow.document.getElementById('pip-display');
        if (pipDisplay) pipDisplay.textContent = formattedTime;
      }
    }

    function update() {
      const now = Date.now();
      elapsedTime = now - startTime;
      updateDisplay(formatTime(elapsedTime));
    }

    function toggleStartPause() {
      if (!running) {
        startTime = Date.now() - elapsedTime;
        timer = setInterval(update, 10);
        running = true;
        updateButtonLabels('Pausar');
      } else {
        clearInterval(timer);
        running = false;
        updateButtonLabels('Continuar');
      }
    }

    function resetTimer() {
      clearInterval(timer);
      running = false;
      elapsedTime = 0;
      updateDisplay('00:00:00.00');
      updateButtonLabels('Iniciar');
    }

    function updateButtonLabels(startText) {
      startPauseBtn.textContent = startText;
      if (pipWindow) {
        const pipStartBtn = pipWindow.document.getElementById('pip-startBtn');
        if (pipStartBtn) pipStartBtn.textContent = startText;
      }
    }

    startPauseBtn.addEventListener('click', toggleStartPause);
    resetBtn.addEventListener('click', resetTimer);

    // Lógica da Janela Flutuante com Controles Integrados
    pipBtn.addEventListener('click', async () => {
      if (!('documentPictureInPicture' in window)) {
        alert('Seu navegador não suporta a funcionalidade de janela flutuante.');
        return;
      }

      if (pipWindow) {
        pipWindow.close();
        pipWindow = null;
        return;
      }

      try {
        pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 280,
          height: 160,
        });

        // HTML e Estilos internos da janela flutuante
        pipWindow.document.body.innerHTML = `
          <div style="
            background-color: #121212; 
            color: #ffffff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-family: Arial, sans-serif;
            margin: 0;
            box-sizing: border-box;
            padding: 10px;
          ">
            <div id="pip-display" style="
              font-family: monospace; 
              font-size: 1.8rem; 
              color: #00e676; 
              margin-bottom: 12px;
            ">${display.textContent}</div>
            
            <div style="display: flex; gap: 8px;">
              <button id="pip-startBtn" style="
                font-size: 0.85rem;
                padding: 6px 14px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                background-color: #007bff;
                color: #fff;
              ">${startPauseBtn.textContent}</button>
              
              <button id="pip-resetBtn" style="
                font-size: 0.85rem;
                padding: 6px 14px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                background-color: #6c757d;
                color: #fff;
              ">Zerar</button>
            </div>
          </div>
        `;

        // Eventos dos botões dentro da janela flutuante
        pipWindow.document.getElementById('pip-startBtn').addEventListener('click', toggleStartPause);
        pipWindow.document.getElementById('pip-resetBtn').addEventListener('click', resetTimer);

        pipWindow.addEventListener('pagehide', () => {
          pipWindow = null;
        });
      } catch (err) {
        console.error('Erro ao abrir janela flutuante:', err);
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrado.'))
        .catch(err => console.error('Erro no Service Worker:', err));
    }
  </script>
</body>
</html>
