<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#007bff">
</head>
<body>
  <div class="container">
    <h1>Cronômetro</h1>
    <div id="display">00:00:00.00</div>
    <div class="buttons">
      <button id="startPauseBtn">Iniciar</button>
      <button id="resetBtn">Zerar</button>
      <button id="pipBtn" title="Abrir janela flutuante sobre outros apps">Flutuar 🗗</button>
    </div>
  </div>

  <script>
    let timer = null;
    let startTime = 0;
    let elapsedTime = 0;
    let running = false;
    let pipWindow = null;

    const display = document.getElementById('display');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pipBtn = document.getElementById('pipBtn');

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      const milliseconds = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}.${milliseconds}`;
    }

    function update() {
      const now = Date.now();
      elapsedTime = now - startTime;
      const formatted = formatTime(elapsedTime);
      
      // Atualiza a tela principal
      display.textContent = formatted;
      
      // Se a janela flutuante estiver ativa, atualiza o tempo nela também
      if (pipWindow) {
        const pipDisplay = pipWindow.document.getElementById('pip-display');
        if (pipDisplay) pipDisplay.textContent = formatted;
      }
    }

    startPauseBtn.addEventListener('click', () => {
      if (!running) {
        startTime = Date.now() - elapsedTime;
        timer = setInterval(update, 10);
        startPauseBtn.textContent = 'Pausar';
        running = true;
      } else {
        clearInterval(timer);
        startPauseBtn.textContent = 'Continuar';
        running = false;
      }
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(timer);
      running = false;
      elapsedTime = 0;
      display.textContent = '00:00:00.00';
      startPauseBtn.textContent = 'Iniciar';
      if (pipWindow) {
        const pipDisplay = pipWindow.document.getElementById('pip-display');
        if (pipDisplay) pipDisplay.textContent = '00:00:00.00';
      }
    });

    // Lógica da Janela Flutuante (Document Picture-in-Picture)
    pipBtn.addEventListener('click', async () => {
      if (!('documentPictureInPicture' in window)) {
        alert('Seu navegador ou sistema operacional não suporta a funcionalidade de janela flutuante para web.');
        return;
      }

      // Se já estiver aberto, fechar ao clicar novamente
      if (pipWindow) {
        pipWindow.close();
        pipWindow = null;
        return;
      }

      try {
        // Solicita a abertura de uma janela flutuante independente
        pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 260,
          height: 120,
        });

        // Monta o layout compacto dentro da mini janela flutuante
        pipWindow.document.body.innerHTML = `
          <div style="
            background-color: #121212; 
            color: #00e676; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: monospace; 
            font-size: 1.6rem;
            margin: 0;
            user-select: none;
          ">
            <span id="pip-display">${display.textContent}</span>
          </div>
        `;

        pipWindow.addEventListener('pagehide', () => {
          pipWindow = null;
        });
      } catch (err) {
        console.error('Erro ao abrir janela flutuante:', err);
      }
    });

    // Registrar o Service Worker para suporte PWA offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrado com sucesso.'))
        .catch(err => console.error('Erro ao registrar Service Worker:', err));
    }
  </script>
</body>
</html>
